name: Publish one Short

# Runs hourly. queue.js uploads at most ONE due item per run and records the
# result back into queue.json, which this workflow commits. That commit is what
# stops the same video going up twice.
on:
  schedule:
  # Narrowed 2026-09-09. Running every 15 min around the clock was 8,670 runs a
  # month across the three repos - past the Actions quota on private repos, and
  # when that runs out GitHub silently stops scheduled workflows. One post a day
  # only needs a window: 8 attempts over two hours still absorbs dropped ticks,
  # and a missed day is picked up by the next window because the item stays due.
  # Narrowed again 2026-09-10 after the quota ran out. GitHub bills a FULL MINUTE
  # per job however short it is, so every extra tick in the window costs the same
  # as a real post. Eight ticks a day x 3 repos was ~750 min/month for 3 posts.
  # Two ticks is enough: the first absorbs a dropped or delayed cron, the second
  # is the retry, and a genuinely missed day stays due so the next window sends
  # it. Do NOT widen this back out, and do not re-add workflow_dispatch.
  # Widened again 2026-09-14. The repos are PUBLIC now, so Actions minutes are
  # free and unlimited - the narrow 2-tick window existed only to control billing
  # and that reason is gone. It was also costing punctuality: GitHub deprioritises
  # scheduled runs, and the 17:04 tick was landing at 19:00-19:14Z, i.e. 20:00 BST
  # instead of the 18:00 BST evening slot. More ticks = more chances one gets
  # picked up promptly. queue.js still posts at most ONE due item per run and
  # commits queue.json, so extra ticks cannot double-post.
  # Rescheduled 2026-09-17 after measuring WHY posts were landing at 21:10 London
  # instead of 18:00. On every run createdAt == startedAt, so nothing is queuing
  # and waiting: GitHub DROPS the early ticks outright and only gets round to
  # creating a run 2-3.5 h after the window opens (measured lag from the 17:02
  # tick over 7 days: 1h57 2h10 2h26 2h56 3h05 3h07 3h49). Adding ticks inside
  # the old window was useless - those are the ticks being dropped.
  #
  # So the window now OPENS THREE HOURS EARLY. A tick that fires before the item
  # is due is a harmless no-op (queue.js only posts an item whose `at` has
  # passed), but if GitHub applies its usual ~3 h lag to one of them, the run
  # lands right on the slot. The tail then runs to 22:xx as catch-up insurance,
  # because a genuinely dropped day is worse than a late one.
  #
  # Safe because queue.js posts at most ONE due item per run and commits
  # queue.json, and `concurrency` serialises overlapping runs. Repos are PUBLIC
  # so Actions minutes are free - the old narrow window existed only to control
  # billing on the free tier and that reason is gone.
    - cron: '6,26,46 15-17 * * *'   # early ticks: no-ops until 18:00Z, but a dropped-and-delayed one lands ON the slot
    - cron: '6,16,26,36,46,56 18-23 * * *'   # the live window for 18:00Z + catch-up tail
                                    # and queue.js guards to one upload per day

permissions:
  contents: write              # needed to commit the updated queue.json

concurrency:
  group: publish-short         # never let two runs upload at once
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0     # full history so the push retry below can rebase

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Verify credentials still work
        shell: bash
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
          YT_CATEGORY_ID: ${{ secrets.YT_CATEGORY_ID }}
          YT_PRIVACY: ${{ secrets.YT_PRIVACY }}
        run: node check.js

      - name: Upload the one due Short
        id: publish
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
          YT_CATEGORY_ID: ${{ secrets.YT_CATEGORY_ID }}
          YT_PRIVACY: ${{ secrets.YT_PRIVACY }}
        shell: bash
        run: |
          set -o pipefail
          node queue.js --confirm | tee run.log

      # Read-only: uploads nothing. Writes stats.json + stats_history.jsonl so the
      # numbers are readable off this machine. --max-age 50 throttles it to roughly
      # one collection per posting window.
      - name: Collect analytics
        continue-on-error: true          # analytics must never block publishing
        shell: bash
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
        run: node analytics.js --limit 30 --max-age 50

      - name: Commit queue.json if something was uploaded
        run: |
          for f in queue.json stats.json stats_history.jsonl; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "Nothing due and no new stats - nothing to commit."
            exit 0
          fi
          git config user.name  "lost-empires-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "publish/stats: $(date -u +%Y-%m-%dT%H:%MZ)"

          # This push is the thing that stops a double-post. The video is
          # already on the channel; the "posted" marker only exists in this
          # commit, and the one-per-day guard reads it back from the repo. If
          # the push is rejected because main moved, and we simply give up, the
          # next tick fifteen minutes later sees an unposted item and uploads
          # the same Short again. So rebase onto the moved main and retry.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt) — rebasing onto origin/main"
            git fetch origin main
            git rebase origin/main || {
              git rebase --abort || true
              echo "::error::queue.json conflicts with origin/main. The video IS"
              echo "::error::uploaded — record it by hand before the next run, or"
              echo "::error::it will be uploaded a second time."
              exit 1
            }
          done
          echo "::error::Upload succeeded but queue.json could not be pushed after 3 attempts."
          exit 1
